# kitty: terminal. Plan and palette: bootstrap/notes/loq-visual.md (piece 3).
# Reload after editing: Ctrl+Shift+F5. Font size live: Ctrl+Shift+= / -.

# Font: same family as GTK and IntelliJ.
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# Look: palette in loq-colors.conf, slightly transparent (Hyprland blurs it).
include loq-colors.conf
background_opacity  0.90
window_padding_width 10
cursor_shape         beam
cursor_blink_interval 0

# No beep. The bash line editor (readline) sends the bell character, e.g.
# Backspace on an empty prompt; kitty is the program that plays it.
enable_audio_bell no
