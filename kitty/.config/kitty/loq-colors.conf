# LOQ palette for kitty: GitHub Dark (Primer) + ice cyan accent.
# 16 terminal colours from the "GitHub Dark" theme (author: GitHub, MIT
# license) as shipped in github.com/kovidgoyal/kitty-themes (GitHub_Dark.conf).
# Changed: cursor, selection, url and borders follow loq-visual.md.

foreground           #c9d1d9
background           #0d1117
selection_foreground #ffffff
selection_background #1f6feb
cursor               #7dcfff
cursor_text_color    #0d1117
url_color            #79c0ff

# Window borders (kitty splits) and tabs.
active_border_color     #7dcfff
inactive_border_color   #30363d
tab_bar_background      #010409
active_tab_foreground   #0d1117
active_tab_background   #7dcfff
inactive_tab_foreground #7d8590
inactive_tab_background #010409

# normal
color0 #484f58
color1 #ff7b72
color2 #3fb950
color3 #d29922
color4 #58a6ff
color5 #bc8cff
color6 #39c5cf
color7 #b1bac4

# bright
color8  #6e7681
color9  #ffa198
color10 #56d364
color11 #e3b341
color12 #79c0ff
color13 #d2a8ff
color14 #56d4dd
color15 #ffffff
