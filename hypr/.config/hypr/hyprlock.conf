# hyprlock: lock screen, style "C, side panel" (same layout family as the rofi
# launcher: dark panel + wallpaper, cyan divider). Texts in English.
# Plan and reasons: bootstrap/notes/loq-visual.md (piece 8).
# Test safely: log in on TTY2 first; if it ever gets stuck, run
# pkill -USR1 hyprlock there (USR1 = unlock).

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

# Wallpaper: same "current" symlink as hyprpaper and rofi. Full path, like
# rofi (no ~ expansion assumed).
background {
    monitor =
    path = /home/rangel/Pictures/Wallpapers/current
    color = rgba(13, 17, 23, 1.0)
}

# Left panel and its cyan divider.
shape {
    monitor =
    size = 640, 1080
    color = rgba(13, 17, 23, 1.0)
    rounding = 0
    position = 0, 0
    halign = left
    valign = center
}
shape {
    monitor =
    size = 2, 1080
    color = rgba(125, 207, 255, 1.0)
    rounding = 0
    position = 640, 0
    halign = left
    valign = center
}

# Clock (24 h) and date (LC_TIME=C forces English names).
label {
    monitor =
    text = <b>$TIME</b>
    color = rgba(125, 207, 255, 1.0)
    font_size = 96
    font_family = $font
    position = 70, 240
    halign = left
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] LC_TIME=C date +"%A, %d %B"
    color = rgba(201, 209, 217, 1.0)
    font_size = 18
    font_family = $font
    position = 76, 140
    halign = left
    valign = center
}

# Small "fastfetch": user, host, battery (refreshed every 10 s).
label {
    monitor =
    text = cmd[update:10000] b=/sys/class/power_supply/BAT1; echo "<span foreground='##7d8590'>user</span>   $USER<br/><span foreground='##7d8590'>host</span>   $(cat /etc/hostname)<br/><span foreground='##7d8590'>wm  </span>   Hyprland<br/><span foreground='##7d8590'>bat </span>   $(cat $b/capacity)% $(cat $b/status | tr 'A-Z' 'a-z')"
    color = rgba(201, 209, 217, 1.0)
    font_size = 15
    font_family = $font
    position = 76, 20
    halign = left
    valign = center
}

# Password field: cyan outline, blue while checking, red on failure.
input-field {
    monitor =
    size = 500, 52
    outline_thickness = 2
    rounding = 4
    outer_color = rgba(125, 207, 255, 1.0)
    inner_color = rgba(1, 4, 9, 1.0)
    font_color = rgba(201, 209, 217, 1.0)
    check_color = rgba(88, 166, 255, 1.0)
    fail_color = rgba(255, 123, 114, 1.0)
    fade_on_empty = false
    placeholder_text = <span foreground='##7d8590'>❯  password</span>
    fail_text = $PAMFAIL
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = false
    font_family = $font
    position = 70, -140
    halign = left
    valign = center
}
