# hyprpaper: wallpaper daemon (started from hyprland.lua autostart).
# Wiki: https://wiki.hypr.land/Hypr-Ecosystem/hyprpaper/
#
# The image is NOT in this repo (public repo, third-party art).
# ~/Pictures/Wallpapers/current is a symlink to the chosen image, so changing
# the wallpaper is: ln -sfn <image> ~/Pictures/Wallpapers/current, then
# restart hyprpaper. See bootstrap/notes/loq-visual.md.

# Do not draw the Hyprland splash text over the wallpaper.
splash = false

# Empty monitor = fallback for every monitor (internal panel and any
# external one plugged in later).
wallpaper {
    monitor =
    path = ~/Pictures/Wallpapers/current
    fit_mode = cover
}
