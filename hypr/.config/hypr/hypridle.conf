# hypridle: what happens when the LOQ sits idle (profile "B, balanced").
# Plan and reasons: bootstrap/notes/loq-visual.md (piece 8).
# The waybar coffee (idle_inhibitor) pauses all of this while it is on.

general {
    lock_cmd = pidof hyprlock || hyprlock                             # never two lock screens
    before_sleep_cmd = loginctl lock-session                          # lock before suspend / lid close
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # screen on after resume
}

# 5 min: dim the screen (-s saves the level, -r restores it).
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 10 min: lock.
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 11 min: screen off.
listener {
    timeout = 660
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 20 min: suspend, but only on battery (on AC: Docker, downloads, builds).
listener {
    timeout = 1200
    on-timeout = ~/.config/hypr/scripts/suspend-on-battery.sh
}

# No keyboard backlight listener: rgb:kbd_backlight does not exist on the LOQ.
