# NVIDIA runtime D3 (the dGPU powers off when idle). Lenovo LOQ 15IRX9.
# With nvidia-open 620 the driver reported "Runtime D3 status: Disabled by
# default" and power/control stayed "on" (verified 2026-11-21), although the
# NVIDIA README says it is on by default for supported Ampere+ notebooks.
# 0x02 = fine-grained power control. Takes effect at the next boot.
options nvidia NVreg_DynamicPowerManagement=0x02
