# TLP settings for the Lenovo LOQ 15IRX9 (hostname arch-loq).
# Installed by bootstrap/install.sh (profile loq) to /etc/tlp.d/01-loq.conf.
# Check what TLP applied: sudo tlp-stat -b -p

# Battery conservation mode (ideapad_laptop driver).
# Lenovo non-ThinkPads only have an on/off cap (about 60% on documented
# models; the value on the LOQ is still to measure). TLP uses the BAT0
# parameters even though this battery is named BAT1.
# 1 = conservation on, 0 = off. For a trip: sudo tlp fullcharge
START_CHARGE_THRESH_BAT0=0
STOP_CHARGE_THRESH_BAT0=1

# Platform profile (verified choices on the LOQ:
# low-power balanced performance max-power custom).
PLATFORM_PROFILE_ON_AC=balanced
PLATFORM_PROFILE_ON_BAT=low-power
