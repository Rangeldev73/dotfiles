# TLP settings for the Lenovo LOQ 15IRX9 (ideapad_laptop driver).
# Check what TLP applied: sudo tlp-stat -b (battery) and sudo tlp-stat -p.
# TLP 1.11 naming: _PRF = performance profile (used on AC), _BAL = balanced
# profile (used on battery), _SAV = power-saver profile (manual).
# The old _AC/_BAT names still work but TLP asks to change them.

# Battery conservation mode: a fixed stop threshold set by the firmware
# (about 60% on documented Lenovo models; the LOQ value is still to measure).
# TLP uses the BAT0 parameter for it even though this battery is BAT1.
# 1 = on, 0 = off (charges to 100%).
STOP_CHARGE_THRESH_BAT0="1"

# platform_profile choices (verified): low-power balanced performance max-power custom.
PLATFORM_PROFILE_ON_PRF=balanced
PLATFORM_PROFILE_ON_BAL=low-power
PLATFORM_PROFILE_ON_SAV=low-power
