# mkinitcpio hooks for the Lenovo LOQ 15IRX9 (systemd initramfs + LUKS2).
# Installed by bootstrap/install.sh (profile loq). After changing it, rebuild:
#   sudo mkinitcpio -P
# No "kms" hook: with it the initramfs carried nouveau.ko plus 661 NVIDIA
# firmware files (137M, verified 2026-11-21). The NVIDIA driver must not load
# early (Intel drives the panel; early NVIDIA may break resume from hibernation).
# keymap is not needed: sd-vconsole reads /etc/vconsole.conf (br-abnt2).
HOOKS=(base systemd autodetect microcode modconf keyboard sd-vconsole block sd-encrypt filesystems fsck)
