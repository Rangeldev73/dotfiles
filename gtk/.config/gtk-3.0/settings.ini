# GTK 3 settings. Source of truth for the look of GTK apps:
# hypr/.config/hypr/scripts/apply-gtk-settings.sh copies these values into
# gsettings at every Hyprland start (GTK apps on Wayland read gsettings).
# Plan and reasons: bootstrap/notes/loq-visual.md (piece 2).
[Settings]
gtk-theme-name=adw-gtk3-dark
gtk-icon-theme-name=Papirus-Dark
gtk-cursor-theme-name=Bibata-Modern-Ice
gtk-cursor-theme-size=24
gtk-font-name=JetBrainsMono Nerd Font 11
gtk-application-prefer-dark-theme=1
